# Claude Code on mobile pushes to a claude/* branch. Merging it into main here is what ships it:
# the PC pulls main about every 45 seconds.
name: Ship Claude branches
on:
  push:
    branches: ['claude/**']
permissions:
  contents: write
concurrency:
  group: ship
  cancel-in-progress: false
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge into main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "jakes-brain-ship"
          git config user.email "jakes-brain-ship@users.noreply.github.com"
          git merge --no-edit "origin/$BRANCH"
          git push origin main
