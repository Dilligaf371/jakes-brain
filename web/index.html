<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jake's Data</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Jake's PC at a glance: machine status, services, and quick notes.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jake's Data">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" type="image/png" href="/icons/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="modulepreload" href="/kit.js">
</head>
<body>
  <div id="banner" class="banner" role="status" aria-live="polite" hidden>Can't reach the PC — retrying…</div>

  <main id="home" class="home" aria-label="Home">
    <p id="home-date" class="home-date" aria-live="off"></p>
    <div id="grid" class="grid" aria-label="Apps"></div>
    <div id="dock" class="dock" aria-label="Dock"></div>
  </main>

  <div id="app" class="applayer" hidden></div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/launcher.js"></script>
</body>
</html>
