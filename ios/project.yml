# Jake's Data iOS shell — regenerate the Xcode project with:  cd ios && xcodegen generate
# (JakesData.xcodeproj is gitignored; this file is the source of truth.)
name: JakesData
options:
  bundleIdPrefix: com.jakebeau
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  JakesData:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JakesData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakebeau.jakesdata
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Jake's Data"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3VTHP9BHH6
    info:
      path: JakesData/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Plain http to the PC's private IPs. Personal app, never for the App Store.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # The LAN candidate (192.168.1.81) is a local-network connection; without this
        # key iOS never shows the Local Network prompt and silently denies the probe.
        NSLocalNetworkUsageDescription: Jake's Data connects to your PC on the home Wi-Fi.
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets: []
